[project]
name = "adobe-ai-bridge-runtime"
version = "0.1.0"
description = "Pinned, locally packaged InDesign MCP runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fonttools>=4.55,<5",
  "mcp[cli]>=1.15,<2",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "python-socketio[client]>=5.12,<6",
  "requests>=2.32,<3",
  "websocket-client>=1.8,<2"
]

[dependency-groups]
dev = ["aiohttp>=3.11,<4", "pyinstaller>=6.11,<7", "pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["../tests/unit", "../tests/integration"]
python_files = ["test_*.py"]
markers = ["integration: exercises the pinned MCP server and a simulated InDesign UXP panel"]
