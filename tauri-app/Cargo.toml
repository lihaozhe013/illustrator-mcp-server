[workspace]
resolver = "2"
members = ["crates/bridge-core", "crates/launcher", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
dirs = "6.0.0"
jsonc-parser = { version = "0.34.0", features = ["serde", "cst"] }
plist = "1.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = "2.12.1"
thiserror = "2.0.17"
uuid = { version = "1.19.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
